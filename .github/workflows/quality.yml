name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests lambdas orchestration scripts spark_jobs
      - run: ruff format --check src tests lambdas orchestration scripts spark_jobs
      - run: mypy src/dataops_factory
      - run: pytest
      - run: python scripts/validate_claims.py
      - run: python scripts/validate_architecture_contract.py
