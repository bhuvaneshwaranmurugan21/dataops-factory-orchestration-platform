name: Spark

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,spark]"
      - run: pytest -m spark tests/test_spark_transforms.py --no-cov
